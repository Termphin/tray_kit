name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool example/lib
      - run: flutter analyze
      - run: flutter test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - working-directory: example
        run: flutter build ${{ matrix.target }} --debug

  kde:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config \
            xvfb dbus-x11 imagemagick plasma-workspace kded5 libgl1-mesa-dri
      - run: flutter pub get
      - working-directory: example
        run: flutter build linux --debug
      - run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          DISPLAY=:99 dbus-run-session -- ci/kde.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kde
          path: out/

  gnome:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [with-extension, without-extension]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config \
            gnome-shell gnome-shell-extension-appindicator mutter libgl1-mesa-dri
      - run: flutter pub get
      - working-directory: example
        run: flutter build linux --debug
      - run: dbus-run-session -- ci/gnome.sh ${{ matrix.mode }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-${{ matrix.mode }}
          path: out/
